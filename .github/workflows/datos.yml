name: Actualizar datos

# Una vez por mes (y a mano desde la pestaña Actions) vuelve a bajar instalaciones,
# áreas y rutas, regenera datos/ y guarda el resultado en el repositorio.
on:
  schedule:
    - cron: "17 9 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar datos
        run: python3 scripts/preparar_datos.py
      - name: Guardar cambios
        run: |
          git config user.name "picadagps-datos"
          git config user.email "actions@users.noreply.github.com"
          git add datos data/fuente
          if git diff --cached --quiet; then echo "Sin cambios en los datos"; exit 0; fi
          git commit -m "Datos actualizados $(date -u +%Y-%m-%d)"
          git push
