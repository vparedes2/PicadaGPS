name: Bajar caminos de otras provincias

# Solo baja de OpenStreetMap los caminos de yacimiento de los cuadros de otras provincias
# y los guarda en data/fuente/caminos-otras-provincias.json (el armado final se hace con preparar_datos.py).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  caminos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar caminos
        run: python3 -u scripts/caminos_otras.py
      - name: Guardar
        run: |
          git config user.name "picadagps-datos"
          git config user.email "actions@users.noreply.github.com"
          git add data/fuente/caminos-otras-provincias.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Caminos de otras provincias $(date -u +%Y-%m-%d)"
          git pull --rebase origin main && git push
